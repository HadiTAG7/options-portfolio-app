# One-off repair for money operations recorded BEFORE the undo feature.
# Reverses a withdrawal session (Withdrawal + auto-Capitalize remainder +
# the GP fee it credited) on one partner and restores their prior state.
#
# Triggered by a commit-message flag on push to the working branch (the
# repo's default branch is elsewhere, so workflow_dispatch isn't
# available here):
#   • commit contains [repair-dry]    → DRY RUN, prints the plan only
#   • commit contains [repair-apply]  → APPLIES the reversal
# Ordinary pushes (no flag) skip the job entirely. Partner/date default
# to علي الغانم / 2026-07-21 (override via workflow_dispatch inputs where
# available). Uses the existing FIREBASE_SERVICE_ACCOUNT secret.

name: Repair Partner Operation

on:
  push:
    branches:
      - claude/write-app-prompt-8V4uK
  workflow_dispatch:
    inputs:
      partner_name:
        description: "اسم الشريك"
        required: false
        default: "علي الغانم"
      target_date:
        description: "تاريخ العملية YYYY-MM-DD"
        required: false
        default: "2026-07-21"
      dry_run:
        description: "1 = معاينة · 0 = تنفيذ"
        required: false
        default: "1"

jobs:
  repair:
    if: >
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.head_commit.message, '[repair-dry]') ||
      contains(github.event.head_commit.message, '[repair-apply]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/write-app-prompt-8V4uK

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Run repair
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          PARTNER_NAME: ${{ inputs.partner_name || 'علي الغانم' }}
          TARGET_DATE: ${{ inputs.target_date || '2026-07-21' }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || (contains(github.event.head_commit.message, '[repair-apply]') && '0' || '1') }}
        run: npx tsx scripts/repair-partner-op.ts
