# One-off repair for money operations recorded BEFORE the undo feature.
# Reverses a withdrawal session (Withdrawal + auto-Capitalize remainder +
# the GP fee it credited) on one partner and restores their prior state.
#
# DORMANT by design: no push trigger (a commit-message flag was used once
# to run the علي الغانم 2026-07-21 reversal, then removed so it can never
# fire by accident). Left here as a documented, reusable tool. To run it
# again, temporarily re-add a push trigger + [repair-apply] flag on the
# working branch (the repo default branch is elsewhere, so
# workflow_dispatch isn't available from here). Always DRY_RUN=1 first.
#
# Uses the existing FIREBASE_SERVICE_ACCOUNT secret.

name: Repair Partner Operation

on:
  workflow_dispatch:
    inputs:
      partner_name:
        description: "اسم الشريك"
        required: false
        default: "علي الغانم"
      target_date:
        description: "تاريخ العملية YYYY-MM-DD"
        required: false
        default: "2026-07-21"
      dry_run:
        description: "1 = معاينة · 0 = تنفيذ"
        required: false
        default: "1"

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/write-app-prompt-8V4uK

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Run repair
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          PARTNER_NAME: ${{ inputs.partner_name || 'علي الغانم' }}
          TARGET_DATE: ${{ inputs.target_date || '2026-07-21' }}
          DRY_RUN: ${{ inputs.dry_run || '1' }}
        run: npx tsx scripts/repair-partner-op.ts
