# Build a debug Android APK and upload it as a workflow artifact.
#
# Trigger manually from the Actions tab (workflow_dispatch). The job:
#   1. Builds the Next.js static export (out/) with MOBILE_BUILD=1.
#   2. Initialises the Android Capacitor project (cap add android is
#      idempotent — runs on first invocation, no-op on later runs).
#   3. Syncs out/ into android/app/src/main/assets/public/.
#   4. Runs ./gradlew assembleDebug to produce app-debug.apk.
#   5. Uploads the .apk as a downloadable artifact (30-day retention).
#
# Supabase credentials are passed at build time as NEXT_PUBLIC_*
# variables, so they get baked into the static bundle. Store them as
# repository secrets named SUPABASE_URL and SUPABASE_ANON_KEY before
# running the workflow.
#
# This produces an UNSIGNED debug APK. Suitable for sideload + internal
# testing. For Play Store distribution, swap assembleDebug for
# assembleRelease and add a signing-key step.

name: Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          # Capacitor 8's CLI requires Node >= 22.
          node-version: "22"
          cache: "npm"

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          # Capacitor 8's Android library compiles with source release 21.
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci

      - name: Build static export
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          # Repository Variable (Settings → Secrets and variables →
          # Actions → Variables). Enforcement is ON by default in code
          # now that accounts are linked + RLS is live (migration 014);
          # unset/empty here = the APK requires sign-in. Set
          # AUTH_ENFORCED=0 only to temporarily ship an open build.
          NEXT_PUBLIC_AUTH_ENFORCED: ${{ vars.AUTH_ENFORCED }}
          # Backend switch (Repository Variable APP_BACKEND). Unset =
          # Supabase. Set to "firebase" at cutover — the APK then talks
          # to Firestore/Firebase Auth. Rollback: clear the variable.
          NEXT_PUBLIC_BACKEND: ${{ vars.APP_BACKEND }}
          # Live stock quotes (optional). Add a FINNHUB_API_KEY repo
          # secret to bake live prices into the APK; without it the app
          # silently shows the last cached prices from the database.
          NEXT_PUBLIC_FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
        run: npm run build:mobile

      # cap add is idempotent on already-initialised projects but errors
      # if no android/ folder exists. Touch the folder on first run.
      - name: Initialise Android project (first run only)
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi

      # App icon + splash screens from assets/ (icon-only /
      # icon-foreground / icon-background / splash) — regenerated every
      # build since android/ itself is not committed.
      - name: Generate app icons & splash screens
        run: npx @capacitor/assets@3 generate --android

      - name: Sync web bundle into Android project
        run: npm run cap:sync

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
          if-no-files-found: error
