# Undo the premature/marked option closes written by the old expiration
# sweep. This edits money-bearing records, so it never runs on a schedule.
#
# A push can only ever produce a REPORT. Writing requires a manual
# workflow_dispatch with apply=true — a deliberate button press, not
# something a commit can ask for.
#
# It used to accept an apply flag in the commit message, and that misfired
# immediately: the commit which introduced the flag described it in its own
# body, `contains()` matched the description, and the intended dry run
# wrote 12 rows. A trigger that can be tripped by prose about the trigger
# is not a safeguard, so the push path no longer has a write mode at all.

name: Repair Option Settlement

on:
  push:
    branches:
      - claude/write-app-prompt-8V4uK
  workflow_dispatch:
    inputs:
      apply:
        description: "Write the changes (false = dry run)"
        type: boolean
        default: false
      today:
        description: "Override today's date (YYYY-MM-DD), optional"
        type: string
        default: ""

jobs:
  repair:
    if: >
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.head_commit.message || '', '[repair-options-dry]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/write-app-prompt-8V4uK
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Repair
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          # Only the explicit apply flag (or a dispatch with apply=true)
          # authorises a write. Everything else is a report.
          # Only a dispatch can authorise a write. Parenthesised so the
          # boolean resolves BEFORE the '1'/'0' mapping — && binds tighter
          # than || in GitHub expressions, and without the parens this
          # would export "true" rather than the flag digit.
          APPLY: >-
            ${{ (github.event_name == 'workflow_dispatch' && inputs.apply)
                && '1' || '0' }}
          TODAY: ${{ github.event_name == 'workflow_dispatch' && inputs.today || '' }}
        run: node scripts/repair-option-settlement.mjs
