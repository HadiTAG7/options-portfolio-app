# One-off: clear the fund-wide pending-profit DUST that trips the deposit
# (Clean-Slate) warning. Runs the real distribution engine, reports every
# partner's pending, and only stamps settlements if all of them are dust —
# it ABORTS if anyone has real profit owing.
#
# Flag-gated on the commit message:
#   [zero-dry]    → report only (no writes)
#   [zero-apply]  → apply
# Uses the existing FIREBASE_SERVICE_ACCOUNT secret.

name: Zero Residual

on:
  push:
    branches:
      - claude/write-app-prompt-8V4uK

jobs:
  run:
    if: >-
      contains(github.event.head_commit.message, '[zero-dry]') ||
      contains(github.event.head_commit.message, '[zero-apply]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/write-app-prompt-8V4uK
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Settle pending dust
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          APPLY: ${{ contains(github.event.head_commit.message, '[zero-apply]') && '1' || '' }}
        run: npx tsx scripts/settle-dust.ts
