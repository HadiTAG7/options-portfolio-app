# Send the monthly partner reports (PDF via Gmail) — ON DEMAND ONLY.
#
# Nothing runs by itself. The GP presses:
#   Actions → "Send Monthly Reports" → Run workflow
# optionally setting month (YYYY-MM, empty = previous month) and/or a
# single partner_id — then every partner gets their PDF by email.
#
# Required repository secrets:
#   FIREBASE_SERVICE_ACCOUNT   (already exists — added for the migration)
#   GMAIL_USER                 the sending Gmail address
#   GMAIL_APP_PASSWORD         App Password from
#                              https://myaccount.google.com/apppasswords
#
# The checkout ref is pinned to the production branch so runs use the
# real app code regardless of which branch registered the workflow.

name: Send Monthly Reports

on:
  workflow_dispatch:
    inputs:
      month:
        description: "الشهر YYYY-MM (فارغ = الشهر الماضي)"
        required: false
      partner_id:
        description: "معرف شريك واحد (فارغ = كل الشركاء)"
        required: false

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/write-app-prompt-8V4uK

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build + email the reports
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          MONTH: ${{ inputs.month }}
          PARTNER_ID: ${{ inputs.partner_id }}
        run: npx tsx scripts/send-monthly-reports.ts
