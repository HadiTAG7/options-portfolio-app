# READ-ONLY diagnostic (no writes). Runs only when a push commit carries
# the [diag] flag. Prints each partner's net-profit figure as computed by
# the Partners card vs the detail page, to locate the discrepancy.
name: Diagnose Profit

on:
  push:
    branches:
      - claude/write-app-prompt-8V4uK

jobs:
  diag:
    if: contains(github.event.head_commit.message, '[diag]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/write-app-prompt-8V4uK
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run diagnostic
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: npx tsx scripts/diagnose-profit.ts
