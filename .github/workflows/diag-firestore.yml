# Read-only diagnostic: prints the live deployed Firestore ruleset + GP
# claims to pinpoint the monthly_profits permission denial. Fires on push
# only when the commit message carries the flag [diag-rules]. Writes
# nothing; safe to run anytime. Remove once the issue is resolved.

name: Diag Firestore

on:
  push:
    branches:
      - claude/write-app-prompt-8V4uK

jobs:
  diag:
    if: contains(github.event.head_commit.message, '[diag-rules]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/write-app-prompt-8V4uK
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Inspect deployed rules + claims
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node scripts/diag-firestore.mjs
