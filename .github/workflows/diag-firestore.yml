# Read-only check: prints the LIVE deployed Firestore ruleset, the GP's
# custom claims, and the contents of daily_snapshots with the day-over-day
# move each pair implies. Writes nothing.
#
# Flag-gated on the commit message: [diag-rules]

name: Diag Firestore

on:
  push:
    branches:
      - claude/write-app-prompt-8V4uK

jobs:
  diag:
    if: contains(github.event.head_commit.message, '[diag-rules]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/write-app-prompt-8V4uK
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Inspect rules + snapshots
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node scripts/diag-firestore.mjs
